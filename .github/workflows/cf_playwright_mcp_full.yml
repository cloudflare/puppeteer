name: "Playwright MCP for Cloudflare - CI"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cf_playwright_mcp_*.yml'
      - '.npmrc'
      - 'package.json'
      - 'examples/playwright-mcp-cloudflare/**'
      - 'packages/browser-test-runtime/**'
      - 'packages/playwright-cloudflare/**'
      - 'packages/playwright-mcp-cloudflare/**'
      - 'patches/playwright.patch'
      - 'patches/playwright-mcp.patch'
      - 'scripts/**'
      - 'submodules/playwright'
      - 'submodules/playwright-mcp'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cf_playwright_mcp_*.yml'
      - '.npmrc'
      - 'package.json'
      - 'examples/playwright-mcp-cloudflare/**'
      - 'packages/browser-test-runtime/**'
      - 'packages/playwright-cloudflare/**'
      - 'packages/playwright-mcp-cloudflare/**'
      - 'patches/playwright.patch'
      - 'patches/playwright-mcp.patch'
      - 'scripts/**'
      - 'submodules/playwright'
      - 'submodules/playwright-mcp'
  workflow_dispatch:

concurrency:
  group: cf-playwright-mcp-worker-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Validate package
        run: |
          npm ci
          git submodule update --init
          npm run test:release-validation
          npm run ci:mcp --workspace @cloudflare/playwright-mcp
          npm exec --prefix submodules/playwright-mcp -- playwright install --with-deps chromium firefox
          npm run check:patch:playwright-mcp
          npm run build --workspace @cloudflare/playwright-mcp
          npm run test:upstream --workspace @cloudflare/playwright-mcp
          npm run test:types --workspace @cloudflare/playwright-mcp
          npm run test:bundle --workspace @cloudflare/playwright-mcp
          npm run build --workspace @cloudflare/playwright-mcp-template
          npm exec -- wrangler deploy --dry-run --config examples/playwright-mcp-cloudflare/wrangler.toml
          npm pack --workspace @cloudflare/playwright-mcp --dry-run
          npm run check:submodules

      - name: Deploy MCP test Worker
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: packages/playwright-mcp-cloudflare/tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Run deployed MCP Browser Run smoke test
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MCP_SERVER_URL: https://playwright-mcp-test-workers.rendering.cfdata.org/mcp
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
        run: npm run test:remote --workspace @cloudflare/playwright-mcp
