name: "Playwright MCP for Cloudflare - Publish to NPM"

on:
  release:
    types: [published]

concurrency:
  group: cf-playwright-mcp-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ startsWith(github.event.release.tag_name, 'cloudflare-playwright-mcp-v') }}
    name: "Publish @cloudflare/playwright-mcp to NPM"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: |
          npm ci
          git submodule update --init
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          package_json='packages/playwright-mcp-cloudflare/package.json'
          package_version="$(node -p "require('./${package_json}').version")"
          expected_tag="cloudflare-playwright-mcp-v${package_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            printf 'Error: GitHub release tag must be exactly %s, but received %s.\n' \
              "${expected_tag}" "${RELEASE_TAG}" >&2
            exit 1
          fi
          semver_core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          prerelease_identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          prerelease="-${prerelease_identifier}(\.${prerelease_identifier})*"
          build='\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          stable_pattern="^${semver_core}(${build})?$"
          prerelease_pattern="^${semver_core}${prerelease}(${build})?$"
          if [[ "${RELEASE_IS_PRERELEASE}" == true && ! "${package_version}" =~ ${prerelease_pattern} ]]; then
            printf 'Error: GitHub prerelease requires a SemVer prerelease package version; found %s.\n' "${package_version}" >&2
            exit 1
          fi
          if [[ "${RELEASE_IS_PRERELEASE}" == false && ! "${package_version}" =~ ${stable_pattern} ]]; then
            printf 'Error: Stable GitHub release requires a stable SemVer package version; found %s.\n' "${package_version}" >&2
            exit 1
          fi
      - name: Validate package
        run: |
          npm run check:patch:playwright-mcp
          npm run test:types --workspace @cloudflare/playwright-mcp
          npm run test:bundle --workspace @cloudflare/playwright-mcp
          npm run check:submodules
      - name: Publish to npm
        working-directory: packages/playwright-mcp-cloudflare
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm publish ${{ github.event.release.prerelease && '--tag next' || '' }}
