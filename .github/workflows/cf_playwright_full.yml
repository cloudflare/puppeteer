name: "Playwright for Cloudflare - Full Test Suite"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cf_playwright_*.yml'
      - '.npmrc'
      - 'package.json'
      - 'packages/browser-test-runtime/**'
      - 'packages/playwright-cloudflare/**'
      - 'patches/playwright.patch'
      - 'scripts/**'
      - 'submodules/playwright'
      - 'submodules/jest'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cf_playwright_*.yml'
      - '.npmrc'
      - 'package.json'
      - 'packages/browser-test-runtime/**'
      - 'packages/playwright-cloudflare/**'
      - 'patches/playwright.patch'
      - 'scripts/**'
      - 'submodules/playwright'
      - 'submodules/jest'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Test filter grep'
        required: false
        type: string

concurrency:
  group: cf-playwright-worker-deployment
  cancel-in-progress: false

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Validate package
        run: |
          npm ci
          git submodule update --init
          npm run test:release-validation
          npm run check:patch:playwright
          npm run build --workspace @cloudflare/playwright
          npm run test:bundle --workspace @cloudflare/playwright
          npm --prefix packages/playwright-cloudflare/tests run test-types
          npm run check:submodules

      - name: Deploy test Worker
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: packages/playwright-cloudflare/tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Run tests
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: packages/playwright-cloudflare
        env:
          TESTS_SERVER_URL: https://playwright-test-workers.rendering.cfdata.org
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TEST_GREP: ${{ inputs.grep }}
        run: |
          args=(--reporter=html)
          if [[ -n "${TEST_GREP}" ]]; then
            args+=(--grep "${TEST_GREP}")
          fi
          npm run test:full -- "${args[@]}"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          name: playwright-report--attempt-${{ github.run_attempt }}
          path: packages/playwright-cloudflare/tests/playwright-report
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd packages/playwright-cloudflare/tests
          npx wrangler pages deploy ./playwright-report --project-name playwright-full-test-report
