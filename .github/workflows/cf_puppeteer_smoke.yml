name: "Puppeteer for Cloudflare - Smoke Tests"
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: cf-puppeteer-worker-deployment
  cancel-in-progress: false

jobs:
  test_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare package
        run: |
          npm ci
          git submodule update --init
          npm run build:puppeteer
          cd packages/puppeteer-cloudflare
          npm run test:prepare:prebuilt
          npm --prefix tests run test-types

      - name: Deploy test Worker
        working-directory: packages/puppeteer-cloudflare/tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Run Smoke Tests
        working-directory: packages/puppeteer-cloudflare
        env:
          BROWSER_BINDINGS: ${{ secrets.BROWSER_BINDINGS }}
          TESTS_SERVER_URL: https://puppeteer-test-workers.rendering.cfdata.org
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
        run: |
          npm run test:smoke -- --reporter=html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          # puppeteer tests run with playwright, that's why it's playwright-report
          name: puppeteer-smoke-playwright-report--attempt-${{ github.run_attempt }}
          path: packages/puppeteer-cloudflare/tests/playwright-report/
          retention-days: 30
