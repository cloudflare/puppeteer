name: "Puppeteer for Cloudflare - Full Tests"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cf_puppeteer_*.yml'
      - '.npmrc'
      - 'package.json'
      - 'packages/browser-test-runtime/**'
      - 'packages/puppeteer-cloudflare/**'
      - 'patches/playwright.patch'
      - 'patches/puppeteer.patch'
      - 'scripts/**'
      - 'submodules/playwright'
      - 'submodules/jest'
      - 'submodules/puppeteer'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cf_puppeteer_*.yml'
      - '.npmrc'
      - 'package.json'
      - 'packages/browser-test-runtime/**'
      - 'packages/puppeteer-cloudflare/**'
      - 'patches/playwright.patch'
      - 'patches/puppeteer.patch'
      - 'scripts/**'
      - 'submodules/playwright'
      - 'submodules/jest'
      - 'submodules/puppeteer'
  workflow_dispatch:

concurrency:
  group: cf-puppeteer-worker-deployment
  cancel-in-progress: false

jobs:
  test_full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate package
        run: |
          npm ci
          git submodule update --init
          npm run test:release-validation
          npm run check:patches:puppeteer
          npm run build:puppeteer
          npm run test:bundle:prebuilt --workspace @cloudflare/puppeteer
          npm --prefix packages/puppeteer-cloudflare/tests run test-types
          npm --prefix packages/puppeteer-cloudflare/tests run typecheck:server
          npm run check:submodules

      - name: Deploy test Worker
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: packages/puppeteer-cloudflare/tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Run Full Tests
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: packages/puppeteer-cloudflare
        env:
          TESTS_SERVER_URL: https://puppeteer-test-workers.rendering.cfdata.org
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
        run: npm run test:full -- --reporter=html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          # puppeteer tests run with playwright, that's why it's playwright-report
          name: puppeteer-playwright-report--attempt-${{ github.run_attempt }}
          path: packages/puppeteer-cloudflare/tests/playwright-report/
          retention-days: 30

      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd packages/puppeteer-cloudflare/tests
          npx wrangler pages deploy ./playwright-report --project-name puppeteer-full-test-report
